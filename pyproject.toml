[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knotsim"
version = "0.0.1"
description = "Simulator of knotted and linked DNA rendered as synthetic AFM images with exact topology labels"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lameya Islam" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "scikit-image>=0.22",
    "h5py>=3.10",
    "omegaconf>=2.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Knot identification (Alexander polynomial). Install one; topoly is the default backend.
topology = ["topoly>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0", "pre-commit>=3.7", "jupyter"]

[project.scripts]
knotsim = "knotsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
